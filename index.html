<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>별자리판 — 지금 내 머리 위의 밤하늘과 별자리 운세</title>
  <meta name="description" content="내 위치에서 지금 올려다본 밤하늘을 3D로 보여 줍니다. 별을 눌러 88개 별자리를 직접 찾고, 별까지의 실제 거리를 입체로 확인하세요.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
    } }
  </script>
</head>
<body class="page-sky">
  <header class="site-head">
    <a class="brand" href="index.html">별자리판</a>
    <nav class="rooms" aria-label="전시실">
      <a href="index.html" aria-current="page"><span class="room-no">1</span>밤하늘</a>
      <a href="zodiac.html#room-2"><span class="room-no">2</span>성좌판</a>
      <a href="zodiac.html#reading"><span class="room-no">3</span>운세</a>
    </nav>
  </header>

  <main class="room-sky">
    <section class="stage" id="stage" aria-label="밤하늘 보기">
      <div class="stage-view" id="stage-3d"></div>
      <div class="stage-view stage-dome" id="stage-dome" hidden>
        <canvas id="dome" aria-label="선택한 날짜와 시각의 전천 별지도. 가운데가 머리 위, 둘레가 지평선입니다."></canvas>
      </div>

      <div class="view-tabs" role="tablist" aria-label="보기 방식">
        <button type="button" role="tab" class="view-tab" data-view="look" aria-selected="true">올려다보기</button>
        <button type="button" role="tab" class="view-tab" data-view="dome" aria-selected="false">전천 지도</button>
        <button type="button" role="tab" class="view-tab" data-view="space" aria-selected="false">입체 우주</button>
      </div>

      <div class="compass" id="compass" role="group" aria-label="바라볼 방향">
        <button type="button" data-az="0">북</button>
        <button type="button" data-az="90">동</button>
        <button type="button" data-az="180">남</button>
        <button type="button" data-az="270">서</button>
        <button type="button" data-zenith="1">머리 위</button>
      </div>
      <div class="zoom" role="group" aria-label="확대">
        <button type="button" id="zoom-in" aria-label="확대">+</button>
        <button type="button" id="zoom-out" aria-label="축소">−</button>
      </div>

      <div class="stage-tip" id="stage-tip" hidden></div>
      <p class="stage-toast" id="toast" role="status" aria-live="polite"></p>
      <p class="stage-help" id="stage-help"></p>
    </section>

    <aside class="console" aria-label="관측 설정">
      <p class="room-sign"><span class="room-no">1</span>밤하늘</p>
      <h1 class="console-title">지금 내 머리 위의 하늘</h1>
      <button type="button" class="btn btn-star" id="here-now">내 위치에서 지금 하늘 보기</button>
      <p class="console-summary" id="summary" aria-live="polite"></p>

      <form class="controls" onsubmit="return false">
        <div class="field">
          <label for="obs-date">관측일 저녁</label>
          <input type="date" id="obs-date">
        </div>
        <div class="field">
          <label for="obs-place">장소</label>
          <select id="obs-place"></select>
        </div>
        <div class="field field-wide">
          <label for="obs-time">시각 <output id="obs-time-out" for="obs-time"></output></label>
          <div class="field-row">
            <input type="range" id="obs-time" min="0" max="720" step="10">
            <button type="button" class="btn btn-ghost" id="obs-now">지금</button>
          </div>
          <div class="range-ticks" aria-hidden="true"><span>저녁 6시</span><span>자정</span><span>새벽 6시</span></div>
        </div>
        <div class="field field-wide">
          <label for="obs-cond">하늘 조건</label>
          <select id="obs-cond">
            <option value="dark">불빛 없는 시골 하늘 (은하수와 5등성까지)</option>
            <option value="city">도시 하늘 (밝은 별만)</option>
          </select>
        </div>
      </form>

      <div class="mode-tabs" role="tablist" aria-label="활동">
        <button type="button" role="tab" class="mode-tab" id="tab-explore" aria-controls="panel-explore" aria-selected="true">둘러보기</button>
        <button type="button" role="tab" class="mode-tab" id="tab-discover" aria-controls="panel-discover" aria-selected="false">발견하기</button>
      </div>

      <section class="mode-panel" id="panel-explore" role="tabpanel" aria-labelledby="tab-explore">
        <div class="toggles">
          <label><input type="checkbox" id="opt-lines" checked> 별자리 선</label>
          <label><input type="checkbox" id="opt-names" checked> 이름</label>
        </div>
        <h2 class="panel-heading" id="visible-heading">지금 하늘에 뜬 별자리</h2>
        <div class="chips" id="visible-list"></div>
      </section>

      <section class="mode-panel" id="panel-discover" role="tabpanel" aria-labelledby="tab-discover" hidden>
        <p class="discover-intro">선과 이름을 감췄습니다. 별자리라고 생각되는 별을 눌러 보세요. 찾은 별자리는 도감에 남습니다.</p>
        <div class="progress">
          <div class="progress-bar"><span id="progress-fill"></span></div>
          <p id="progress-text"></p>
        </div>
        <div class="discover-actions">
          <button type="button" class="btn btn-light" id="hint-btn">힌트 보기</button>
          <button type="button" class="btn btn-ghost" id="reset-btn">도감 비우기</button>
        </div>
        <p class="hint-text" id="hint-text" aria-live="polite"></p>
        <h2 class="panel-heading">내 별자리 도감</h2>
        <div class="chips" id="found-list"></div>
      </section>

      <article class="label detail" id="detail" hidden aria-live="polite">
        <p class="label-kicker" id="detail-pos"></p>
        <h2 class="label-title label-title-small" id="detail-name"></h2>
        <p class="label-sub" id="detail-latin"></p>
        <p class="label-body" id="detail-guide"></p>
        <p class="label-note" id="detail-depth"></p>
        <p class="label-note" id="detail-season"></p>
        <div class="label-actions">
          <button type="button" class="btn btn-ink" id="detail-3d">입체로 보기</button>
          <a class="btn btn-line" id="detail-zodiac" hidden></a>
        </div>
      </article>

      <p class="console-credit">별 데이터: <a href="https://github.com/ofrohn/d3-celestial">d3-celestial</a> (BSD-3), 거리: <a href="https://github.com/astronexus/HYG-Database">HYG</a> (CC BY-SA 4.0). 행성은 표시하지 않습니다.</p>
    </aside>
  </main>

  <script src="js/data.js"></script>
  <script src="js/sky-data.js"></script>
  <script src="js/sky-ko.js"></script>
  <script src="js/astro.js"></script>
  <script src="js/milkyway.js"></script>
  <script src="js/sky-view.js"></script>
  <script type="module" src="js/sky-page.js"></script>
</body>
</html>
